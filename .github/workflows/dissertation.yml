name: Reproduce dissertation experiments
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dissertation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dissertation/requirements-lock.txt
      - run: python -m pip install -r dissertation/requirements-lock.txt
      - run: python dissertation/reproduce.py --recompute
